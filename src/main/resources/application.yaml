server:
  port: 8081

spring:
  application:
    name: inventory-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

clients:
  order-service:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8082}
