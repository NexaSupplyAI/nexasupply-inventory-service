server:
  port: 8081

spring:
  application:
    name: inventory-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: inventory
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    internal-jwt:
      enabled: ${INTERNAL_JWT_ENABLED:false}
      secret: ${INTERNAL_JWT_SECRET:}
      issuer: ${INTERNAL_JWT_ISSUER:nexasupply-portal}
      audience: ${INTERNAL_JWT_AUDIENCE:nexasupply-internal-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs
